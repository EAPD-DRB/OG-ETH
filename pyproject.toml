[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogeth"
version = "0.4.0"
authors = [
    {name = "Marcelo LaFleur, Richard W. Evans, and Jason DeBacker"},
]
description = "Ethiopia Calibration for OG-Core"
readme = "README.md"
license = {text = "CC0 1.0 Universal (CC0 1.0) Public Domain Dedication"}
requires-python = ">=3.12, <3.14"
keywords = [
    "ETH",
    "Ethiopia",
    "calibration",
    "overlapping generations",
    "fiscal policy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy",
    "psutil",
    "scipy>=1.7.1",
    "pandas>=1.2.5",
    "matplotlib",
    "dask>=2.30.0",
    "distributed>=2.30.1",
    "paramtools>=0.20.0",
    "requests",
    "xlwt",
    "openpyxl>=3.1.2",
    "statsmodels",
    "linearmodels",
    "linecheck",
    "ogcore>=0.24.4",
]

[project.urls]
Homepage = "https://github.com/EAPD-DRB/OG-ETH/"
"Issue Tracker" = "https://github.com/EAPD-DRB/OG-ETH/issues"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "pytest-xdist",
    "coverage",
    "ruff",
    "ipython",
    "ipykernel",
    "jupyter",
]
docs = [
    "jupyter-book>=1.0,<2.0",
    "sphinx>=3.5.4",
    "sphinx-book-theme>=0.1.3",
    "sphinx-argparse",
    "sphinx-exercise",
    "sphinx-proof",
    "sphinxcontrib-bibtex>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["ogeth*"]

[tool.setuptools.package-data]
ogeth = [
    "ogeth_default_parameters.json",
    "ogeth_multi_industry_parameters.json",
    "data/*",
]

[tool.ruff]
line-length = 79
target-version = "py312"
# Notebooks are teaching artifacts, not package code (matches OG-Core).
exclude = ["**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F841"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
markers = [
    "local: marks tests that are run locally only and not on GH Actions",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
ogeth = { workspace = true, editable = true }
# OG-Core master (2d09808) plus four open pull requests, merged on the
# branch integrate/eth-external-debt of marcelolafleur/OG-Core:
# PSLmodels/OG-Core#1279 (government debt contracted abroad at its own
# interest rate, alpha_D_ext and r_D_ext_annual, for Issue #1125),
# PSLmodels/OG-Core#1280 (initial household wealth accelerated with the
# prices under Anderson), and the speed fixes PSLmodels/OG-Core#1276 and
# #1277 (household transition solves; results unchanged). uv-only; the PyPI
# metadata above keeps ogcore>=0.24.4. Move to a release once they merge.
ogcore = { git = "https://github.com/marcelolafleur/OG-Core", rev = "5b5c9c7279619112e88c7d165e17da9f178bc40c" }

[dependency-groups]
dev = [
    "ogeth",
]
